{% extends "base.html" %}
{% block title %}Today · MedBuddy{% endblock %}
{% block content %}

<header class="page-head">
    <div>
        <h1>Today's Schedule</h1>
        <p class="page-sub" id="today-date"></p>
    </div>
    <a class="btn primary" href="/api/report/pdf" target="_blank">↓ Export Health PDF</a>
</header>

<section class="schedule-summary glass-card">
    <div class="ss-item">
        <div class="ss-value" id="ss-total">0</div>
        <div class="ss-label">Total doses today</div>
    </div>
    <div class="ss-item">
        <div class="ss-value" id="ss-taken" style="color:var(--brand-light)">0</div>
        <div class="ss-label">Taken</div>
    </div>
    <div class="ss-item">
        <div class="ss-value" id="ss-upcoming" style="color:#a5b4fc">0</div>
        <div class="ss-label">Upcoming</div>
    </div>
    <div class="ss-item">
        <div class="ss-value" id="ss-missed" style="color:#fca5a5">0</div>
        <div class="ss-label">Missed</div>
    </div>
</section>

<section id="slot-list" class="card-grid" style="margin-top:20px"></section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/schedule.js') }}"></script>
{% endblock %}
