<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedBuddy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=11">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-shell">

    <div class="cinematic-bg">
        <video autoplay muted loop playsinline>
            <source src="{{ url_for('static', filename='assets/give_videos_to_make_it_dynamic.mp4') }}" type="video/mp4">
        </video>
    </div>

    <div class="app-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <svg class="ecg-line" viewBox="0 0 1200 200" preserveAspectRatio="none">
            <path d="M0,100 L200,100 L220,60 L240,140 L260,100 L500,100 L520,40 L540,160 L560,100 L800,100 L820,70 L840,130 L860,100 L1200,100"
                  stroke="rgba(110,231,183,0.15)" stroke-width="2" fill="none"/>
        </svg>
    </div>

    <aside class="sidebar">
        <div class="brand">MedBuddy</div>
        <nav>
            <a href="{{ url_for('dashboard') }}"      class="{% if request.endpoint=='dashboard' %}active{% endif %}"><span>🏠</span> Dashboard</a>
            <a href="{{ url_for('scanner') }}"        class="{% if request.endpoint=='scanner' %}active{% endif %}"><span>📄</span> Scanner</a>
            <a href="{{ url_for('medicines_page') }}" class="{% if request.endpoint=='medicines_page' %}active{% endif %}"><span>💊</span> Medicines</a>
            <a href="{{ url_for('allergies_page') }}" class="{% if request.endpoint=='allergies_page' %}active{% endif %}"><span>⚠</span> Allergies</a>
            <a href="{{ url_for('schedule_page') }}"  class="{% if request.endpoint=='schedule_page' %}active{% endif %}"><span>⏰</span> Today</a>
            <a href="{{ url_for('vitals_page') }}"    class="{% if request.endpoint=='vitals_page' %}active{% endif %}"><span>📈</span> Vitals</a>
            <a href="{{ url_for('chart_page') }}"     class="{% if request.endpoint=='chart_page' %}active{% endif %}"><span>📊</span> Health Chart</a>
            <a href="{{ url_for('exercises_page') }}" class="{% if request.endpoint=='exercises_page' %}active{% endif %}"><span>🧘</span> Exercises</a>
            <a href="{{ url_for('diet_page') }}"      class="{% if request.endpoint=='diet_page' %}active{% endif %}"><span>🥗</span> Diet</a>
            <a href="{{ url_for('ai_page') }}"        class="{% if request.endpoint=='ai_page' %}active{% endif %}"><span>🤖</span> AI Assistant</a>
            <a href="{{ url_for('profile_page') }}"   class="{% if request.endpoint=='profile_page' %}active{% endif %}"><span>👤</span> Profile</a>
            <a href="{{ url_for('settings_page') }}"  class="{% if request.endpoint=='settings_page' %}active{% endif %}"><span>⚙</span> Settings</a>
            {% if user and user.is_admin %}
            <a href="{{ url_for('admin_page') }}"     class="{% if request.endpoint=='admin_page' %}active{% endif %}"><span>🛡</span> Admin</a>
            {% endif %}
        </nav>
        <a href="{{ url_for('logout') }}" class="logout-btn">→ Logout</a>
    </aside>

    <main class="main">
        <div id="toast-root"></div>
        <div class="fade-in">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
